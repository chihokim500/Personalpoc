<title>Requirements Quality Gate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Single light theme (switched from dark on 2026-09-29: the page is a long review document —
     requirements, ER questions, tables — so light surfaces read better). Brand hues the user chose
     (accent #4880FF, Value #4AD991, Risk #FF9066, [값] #FEC53D) are kept as fills/borders; *-ink
     tokens are darker shades of the same hues for text on light backgrounds. */
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --ink: #202632;
    --ink-dim: #667085;
    --border: #dce2ea;
    --accent: #4880ff;
    --accent-ink: #2f5fd0;
    --accent-soft: #e8efff;
    --critical: #d92d20;
    --critical-soft: #fee4e2;
    --high: #b45309;
    --high-soft: #fef0dc;
    --low: #667085;
    --low-soft: #f2f4f7;
    --value: #4ad991;
    --value-ink: #0e7a4b;
    --value-soft: #ddf7ea;
    --risk: #ff9066;
    --risk-ink: #b8431a;
    --risk-soft: #ffe9df;
    --gold: #fec53d;
    --gold-ink: #7a5200;
    --gold-soft: #fff1c7;
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    line-height: 1.6;
  }
  .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }
  a { color: var(--accent-ink); }
  button, select, input { font-family: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 72px; }

  /* ---- nav ---- */
  .topnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .brand-mark { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 13px; color: var(--ink); }
  .nav-actions { display: flex; gap: 8px; }
  .btn {
    font-size: 14.5px; border-radius: 8px; padding: 8px 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .92; color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; }

  /* ---- hero ---- */
  .hero { margin-bottom: 34px; }
  .eyebrow { font-size: 13.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 10px; }
  h1 { font-size: clamp(28px, 4.4vw, 40px); margin: 0 0 12px; letter-spacing: -0.01em; }
  .hero p.lede { color: var(--ink); max-width: 68ch; margin: 0 0 20px; font-size: 17px; }
  @media (min-width: 1000px) { .hero h1, .hero p.lede { white-space: nowrap; max-width: none; } }

  .flow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .flow-step {
    font-size: 14.5px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 13px; white-space: nowrap;
  }
  .flow-arrow { color: var(--ink); font-size: 16px; }

  .principle {
    font-size: 15px; color: var(--ink); border-left: 3px solid var(--accent); padding: 8px 0 8px 12px;
  }
  .principle code { font-family: inherit; background: var(--surface-2); border-radius: 4px; padding: 1px 6px; font-size: 1em; color: var(--ink); }

  /* ---- case cards ---- */
  .section-title { font-size: 15.5px; font-weight: 600; margin: 0 0 4px; }
  .section-sub { font-size: 14.5px; color: var(--ink); margin: 0 0 16px; }
  .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 680px) { .card-grid { grid-template-columns: 1fr; } }

  .case-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s ease, transform .15s ease; box-shadow: 0 1px 3px rgba(16,24,40,.08);
    color: var(--ink); font-family: inherit;
  }
  .case-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .case-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .case-type-badge {
    display: inline-block; align-self: flex-start; font-size: 12px;
    font-weight: 600; letter-spacing: .04em; border-radius: 4px; padding: 3px 10px;
  }
  .case-type-value { background: var(--value-soft); color: var(--value-ink); }
  .case-type-risk { background: var(--risk-soft); color: var(--risk-ink); }
  .case-title { font-size: 18px; font-weight: 600; margin: 0; }
  .case-row { font-size: 14.5px; }
  .case-row .label {
    font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink); display: flex; align-items: center; gap: 5px; margin-bottom: 3px;
  }
  .case-row .val { color: var(--ink); }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 12px; background: var(--surface-2); color: var(--ink);
    border-radius: 999px; padding: 3px 9px;
  }
  .card-cta { font-size: 13.5px; color: var(--accent-ink); margin-top: 2px; }

  /* ---- priority badges ---- */
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    display: inline-block; font-size: 12px; font-weight: 600;
    border-radius: 4px; padding: 2px 9px; letter-spacing: .02em; white-space: nowrap;
  }
  .badge-p0 { background: var(--critical-soft); color: var(--critical); }
  .badge-p1 { background: var(--high-soft); color: var(--high); }
  .badge-p2 { background: var(--low-soft); color: var(--low); }

  .priority-legend {
    display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 22px; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .legend-row { display: flex; gap: 9px; align-items: flex-start; flex: 1 1 220px; min-width: 200px; }
  .legend-row .legend-text b { display: block; font-size: 14.5px; margin-bottom: 2px; }
  .legend-row .legend-text span { color: var(--ink); font-size: 13.5px; }

  /* ---- detail page ---- */
  .case-header { margin-bottom: 30px; }
  .case-header h2 { font-size: 27px; margin: 6px 0 14px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 14px; }
  @media (max-width: 600px) { .meta-grid { grid-template-columns: 1fr; } }
  .meta-item .label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 3px; }
  .meta-item .val { font-size: 15.5px; }
  .meta-item .val.placeholder { color: var(--ink-dim); font-style: italic; }
  .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; font-size: 15.5px; margin-bottom: 6px; }

  .req-block { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 18px; overflow: hidden; }
  .req-block > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .req-block > summary::-webkit-details-marker { display: none; }
  .req-block[open] { border-color: var(--accent); }
  .req-num { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink); }
  .req-title { font-size: 16.5px; margin-top: 3px; }
  .req-caret { color: var(--ink); flex: none; transition: transform .15s ease; }
  .req-block[open] .req-caret { transform: rotate(90deg); }
  .req-body { padding: 0 18px 20px; border-top: 1px solid var(--border); }

  .stage { padding-top: 20px; }
  .stage-num { font-size: 12.5px; color: var(--accent-ink); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
  .stage-note { font-size: 13px; color: var(--ink); font-style: italic; margin: 4px 0 0; }

  .virtual-req { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 16px; }

  .subcard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .subcard-full { margin-top: 10px; }
  @media (max-width: 760px) { .subcard-grid { grid-template-columns: 1fr; } }
  .subcard { border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; }
  .subcard h4 { font-size: 13px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); margin: 0 0 8px; }
  .subcard ul { margin: 0; padding-left: 16px; font-size: 15px; }
  .subcard li { margin-bottom: 7px; }
  .subcard li .badge { margin-right: 5px; }
  .subcard .empty { color: var(--ink); font-style: italic; font-size: 14.5px; }
  .basis { display: block; font-size: 12.5px; color: var(--ink); margin-top: 2px; }

  .before-after { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .ba-block { border-radius: 8px; padding: 12px 14px; font-size: 15.5px; }
  .ba-before { background: var(--surface-2); }
  .ba-after { background: var(--accent-soft); border: 1px solid var(--accent); }
  .ba-label { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; display: block; }
  .ba-arrow { text-align: center; color: var(--ink); font-size: 15px; }

  .ph { border-radius: 4px; padding: 0 3px; }
  .ph-value { font-family: 'IBM Plex Mono', monospace; background: var(--gold-soft); color: var(--gold-ink); font-size: 1em; }
  .ph-generic { font-family: 'IBM Plex Mono', monospace; background: var(--gold-soft); color: var(--gold-ink); font-size: 1em; }
  sup.ref-tag { color: var(--accent-ink); font-size: 12px; margin-left: 1px; }

  .ref-list { margin-top: 10px; font-size: 13.5px; color: var(--ink); }
  .ref-list li { margin-bottom: 5px; }
  .ref-list b { color: var(--ink); font-weight: 600; }

  .ac-list { margin: 0; padding-left: 0; list-style: none; }
  .ac-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 15px; }
  .ac-item .vm { color: var(--ink); font-size: 13.5px; margin-top: 4px; }

  /* ---- review closure (human-in-the-loop) ---- */
  .req-progress { font-size: 12.5px; color: var(--ink); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; margin-left: 8px; white-space: nowrap; }
  .req-progress.done { background: var(--value-soft); color: var(--value-ink); }
  .review-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 18px;
    background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 14.5px;
  }
  .review-bar b { font-weight: 600; }
  .review-bar .btn { margin-left: auto; padding: 4px 11px; font-size: 13px; }
  .review-note { font-size: 13.5px; color: var(--ink); margin: 0 0 10px; }

  .review-list { list-style: none; margin: 0; padding: 0; font-size: 15px; }
  .review-list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .review-list li:last-child { border-bottom: 0; }
  .review-list li.is-excluded .item-text { text-decoration: line-through; opacity: .5; }
  .ac-item.is-excluded .item-text { text-decoration: line-through; opacity: .5; }
  .ac-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .decide { display: inline-flex; gap: 4px; flex: none; }
  .decide button {
    font-size: 12.5px; border: 1px solid var(--border); background: transparent;
    color: var(--ink); border-radius: 999px; padding: 2px 10px; cursor: pointer;
  }
  .decide button:hover { border-color: var(--accent); }
  .decide button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .decide button.d-adopt[aria-pressed="true"] { background: var(--value-soft); color: var(--value-ink); border-color: var(--value); }
  .decide button.d-exclude[aria-pressed="true"] { background: var(--critical-soft); color: var(--critical); border-color: var(--critical); }

  .er-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .er-item.st-closed { border-color: var(--value); }
  .er-item.st-out { opacity: .6; }
  .er-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; font-size: 15px; }
  .er-status {
    flex: none; font-size: 13px; border-radius: 999px; padding: 3px 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); cursor: pointer;
  }
  .er-status:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .er-status.st-open { color: var(--gold-ink); border-color: var(--gold); }
  .er-status.st-review { color: var(--accent-ink); border-color: var(--accent); }
  .er-status.st-closed { color: var(--value-ink); border-color: var(--value); }
  .er-status.st-out { color: var(--ink-dim); }
  .ph-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px 10px; margin-top: 9px; align-items: center; }
  @media (max-width: 600px) { .ph-fields { grid-template-columns: 1fr; } }
  .ph-fields .ph { justify-self: start; font-size: 14px; }
  .ph-input {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--ink);
    font-family: inherit; font-size: 15px; padding: 6px 9px;
  }
  .ph-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .er-extra-title { font-size: 13px; color: var(--ink); margin: 14px 0 4px; }
  .ph-filled { background: var(--value-soft); color: var(--value-ink); }
  .ph-na { font-family: 'IBM Plex Mono', monospace; background: var(--surface-2); color: var(--ink-dim); }
  .ph-input:disabled { opacity: .5; cursor: not-allowed; }
  .ph-draft { background: var(--accent-soft); color: var(--accent-ink); }
  .after-state { font-size: 12px; border-radius: 999px; padding: 1px 8px; margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .after-state.open { background: var(--gold-soft); color: var(--gold-ink); }
  .after-state.done { background: var(--value-soft); color: var(--value-ink); }

  /* ---- traceability ---- */
  .tr-id { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-right: 6px; white-space: nowrap; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table.trace { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 640px; }
  table.trace th { text-align: left; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 9px 12px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
  table.trace td { padding: 9px 12px; border-top: 1px solid var(--border); vertical-align: top; }
  table.trace td .cell-item { display: block; margin-bottom: 6px; }
  table.trace td .cell-item:last-child { margin-bottom: 0; }
  table.trace .is-excluded { text-decoration: line-through; opacity: .5; }
  .tr-state { font-size: 12px; border-radius: 999px; padding: 1px 8px; margin-left: 4px; border: 1px solid var(--border); white-space: nowrap; }
  .tr-state.st-open { color: var(--gold-ink); border-color: var(--gold); }
  .tr-state.st-review { color: var(--accent-ink); border-color: var(--accent); }
  .tr-state.st-closed { color: var(--value-ink); border-color: var(--value); }
  .tr-state.st-out { color: var(--ink-dim); }
  .tr-warn { color: var(--gold-ink); font-size: 14px; }
  .trace-warns { margin: 10px 0 0; padding: 10px 14px; background: var(--gold-soft); border-radius: 8px; font-size: 14px; color: var(--gold-ink); }
  .trace-warns ul { margin: 4px 0 0; padding-left: 18px; }
  .trace-ok { margin: 10px 0 0; font-size: 14px; color: var(--value-ink); }
  .matrix-link { margin-top: 4px; }
  table.matrix td.num, table.matrix th.num { text-align: center; white-space: nowrap; }
  table.matrix tr.row-link { cursor: pointer; }
  table.matrix tr.row-link:hover td { background: var(--surface-2); }
  table.matrix .m-title { font-size: 14.5px; }
  table.matrix .m-case { font-size: 13px; color: var(--ink); }

  /* ---- similar requirements ---- */
  .sim-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .sim-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sim-topic { font-weight: 600; font-size: 15.5px; }
  .sim-head .btn { padding: 4px 11px; font-size: 13px; }
  .sim-req { margin: 8px 0 6px; font-size: 14.5px; }
  .sim-pairs { margin: 0; padding-left: 0; list-style: none; font-size: 14px; }
  .sim-pairs li { padding: 5px 0; border-top: 1px solid var(--border); }
  .sim-arrow { color: var(--ink); margin-right: 6px; }
  .sim-vals { display: block; margin-top: 3px; color: var(--value-ink); font-size: 13.5px; }

  /* ---- collapsed detail section ---- */
  .more-details { margin-top: 22px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .more-details > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; font-size: 15px; list-style: none; }
  .more-details > summary::-webkit-details-marker { display: none; }
  .more-details > summary::before { content: '▸'; display: inline-block; margin-right: 8px; transition: transform .15s ease; }
  .more-details[open] > summary::before { transform: rotate(90deg); }
  .more-details > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .more-hint { font-weight: 400; font-size: 13.5px; color: var(--ink-dim); margin-left: 6px; }
  .more-body { padding: 0 14px 18px; border-top: 1px solid var(--border); }

  /* ---- roadmap ---- */
  .roadmap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 760px) { .roadmap { grid-template-columns: 1fr; } }
  .roadmap-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .roadmap-col h3 { font-size: 15.5px; margin: 8px 0 8px; }
  .roadmap-col ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
  .roadmap-col li { margin-bottom: 6px; }
  .stage-chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
  .stage-now { background: var(--value-soft); color: var(--value-ink); }
  .stage-next { background: var(--accent-soft); color: var(--accent-ink); }
  .stage-future { background: var(--surface-2); color: var(--ink); }


  footer.page-note {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border);
    font-size: 13.5px; color: var(--ink); max-width: 74ch;
  }

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById('poc-data').textContent);
  var app = document.getElementById('app');
  var state = { view: 'home', caseId: null };

  var PRIORITY_LABEL = { P0: 'P0', P1: 'P1', P2: 'P2' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

  function badge(priority) {
    var cls = 'badge-' + String(priority || 'p2').toLowerCase();
    return '<span class="badge ' + cls + '">' + esc(PRIORITY_LABEL[priority] || priority) + '</span>';
  }

  function sortByRank(list) {
    return (list || []).slice().sort(function (a, b) { return (a.rank || 999) - (b.rank || 999); });
  }

  function priorityLegendHtml() {
    return (
      '<div class="priority-legend">' +
        '<div class="legend-row">' + badge('P0') +
          '<span class="legend-text"><b>개발 전 필수 확인</b><span>미확정 시 구현 범위나 핵심 동작을 결정하기 어려운 항목</span></span>' +
        '</div>' +
        '<div class="legend-row">' + badge('P1') +
          '<span class="legend-text"><b>설계 시 확인</b><span>요구 방향은 명확하나 상세설계를 위해 추가 결정이 필요한 항목</span></span>' +
        '</div>' +
      '</div>'
    );
  }

  // ---------- HOME ----------
  var CASE_TYPE_LABEL = { value: 'Value Case', risk: 'Risk Case' };

  function doneIconSvg() {
    return (
      '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex:none" aria-hidden="true">' +
        '<circle cx="7" cy="7" r="7" fill="#4ad991"/>' +
        '<path d="M4 7.3L6.1 9.4L10.2 4.9" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>'
    );
  }

  function caseCardHtml(c) {
    var tags = c.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var row1Label = '사례 특징';
    var row2Label = 'Quality Gate 포인트';
    return (
      '<button class="case-card" data-action="open-case" data-case-id="' + c.id + '">' +
        '<span class="case-type-badge case-type-' + c.case_type + '">' + CASE_TYPE_LABEL[c.case_type] + '</span>' +
        '<p class="case-title">' + esc(c.title) + '</p>' +
        '<div class="case-row"><span class="label">' + doneIconSvg() + row1Label + '</span><span class="val">' + esc(c.case_tag) + '</span></div>' +
        '<div class="case-row"><span class="label">' + doneIconSvg() + row2Label + '</span><span class="val">' + esc(c.core_point) + '</span></div>' +
        '<div class="case-row"><span class="label">' + doneIconSvg() + '요구사항 관점</span></div>' +
        '<div class="tag-row">' + tags + '</div>' +
        '<span class="card-cta">사례 분석 보기 &rarr;</span>' +
      '</button>'
    );
  }

  function renderHome() {
    var flowSteps = ['현장 사례', '가상 요구사항', 'AI 검토안 · AC 초안', '사람 검토 · 결정', '최종 요구사항 · AC'];
    var flowHtml = flowSteps.map(function (s, i) {
      return '<span class="flow-step">' + esc(s) + '</span>' + (i < flowSteps.length - 1 ? '<span class="flow-arrow">&rarr;</span>' : '');
    }).join('');

    var valueCases = DATA.cases.filter(function (c) { return c.case_type === 'value'; });
    var riskCases = DATA.cases.filter(function (c) { return c.case_type === 'risk'; });

    app.innerHTML =
      '<div class="topnav">' +
        '<div class="brand" data-action="go-home"><span class="brand-mark">Requirements Quality Gate</span></div>' +
        '<div class="nav-actions"></div>' +
      '</div>' +
      '<div class="hero">' +
        '<p class="eyebrow">AI Proof of Concept</p>' +
        '<h1>실제 로봇 현장 사례로 보는 요구사항 품질 게이트</h1>' +
        '<p class="lede">실제 로봇 현장 사례를 가상 요구사항으로 전환하고, 개발 전에 요구사항의 모호성·누락·검증 필요 항목을 점검하는 AI PoC입니다.</p>' +
        '<div class="flow">' + flowHtml + '</div>' +
        '<p class="principle">AI는 기술 수치를 임의로 생성하지 않으며, 확정되지 않은 기술값은 <code>Engineering Review Required</code>로 표시해 별도 검토가 필요하도록 구분합니다. AI 결과는 확정안이 아닌 검토 후보이며, 엔지니어가 채택·제외하고 값을 확정합니다.</p>' +
        '<p class="matrix-link"><button class="btn" data-action="go-matrix">요구사항 추적 매트릭스 보기 &rarr;</button></p>' +
      '</div>' +
      '<p class="section-title">도입·운영 사례 — Value Case</p>' +
      '<p class="section-sub">실제 로봇 도입·운영 사례에서 수행 업무를 요구사항으로 전환하고, 구현 전에 추가로 정의해야 할 조건을 점검합니다.</p>' +
      '<div class="card-grid">' + valueCases.map(caseCardHtml).join('') + '</div>' +
      '<p class="section-title" style="margin-top:32px">Risk Case</p>' +
      '<p class="section-sub">실제 사고 사례를 기반으로, 유사 사고 예방을 위해 요구사항 단계에서 확인해야 할 조건을 점검합니다.</p>' +
      '<div class="card-grid">' + riskCases.map(caseCardHtml).join('') + '</div>' +
      roadmapHtml();
  }

  // ---------- TRACEABILITY MATRIX (all requirements) ----------
  function renderMatrix() {
    var totals = { req: 0, mi: 0, er: 0, erDone: 0, ac: 0, warn: 0 };
    var rows = DATA.cases.map(function (c) {
      return c.requirements.map(function (r) {
        var s = reviewStats(r), cov = traceCoverage(r);
        var warn = cov.acOrphans.length + cov.miNoAc.length;
        totals.req++; totals.mi += (r.missing_items || []).length; totals.er += s.erTotal; totals.erDone += s.erDone;
        totals.ac += (r.acceptance_criteria || []).length; totals.warn += warn;
        return (
          '<tr class="row-link" data-action="open-case" data-case-id="' + c.id + '">' +
            '<td><span class="cell-item">' + esc(r.id) + '</span><span class="case-type-badge case-type-' + c.case_type + '">' + CASE_TYPE_LABEL[c.case_type] + '</span></td>' +

          '</tr>'
        );
      }).join('');
    }).join('');

    app.innerHTML =
      '<div class="topnav"><div class="brand" data-action="go-home"><span class="brand-mark">Requirements Quality Gate</span></div><div class="nav-actions"></div></div>' +
      '<button class="btn btn-back" data-action="go-home">&larr; 전체 사례로</button>' +
      '<div class="hero">' +
        '<p class="eyebrow">Traceability</p>' +
        '<h1>요구사항 추적 매트릭스</h1>' +
        '<p class="lede">사례에서 도출한 요구사항 ' + totals.req + '건을 한 화면에서 봅니다. 행을 누르면 해당 사례의 누락 조건 → Engineering Review → AC 연결을 볼 수 있습니다.</p>' +
      '</div>' +
      '<div class="table-wrap"><table class="trace matrix"><thead><tr>' +
        '<th>ID</th><th>요구사항</th><th class="num">누락 조건</th><th class="num">ER 확정</th><th class="num">AC</th><th class="num">검토 상태</th><th class="num">추적 점검</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="stage-note">합계: 누락 조건 ' + totals.mi + '건 · Engineering Review ' + totals.erDone + ' / ' + totals.er + ' 확정 · AC ' + totals.ac + '건 · 추적 점검 필요 ' + totals.warn + '건. 항목 간 연결은 AI가 제안한 것이며 검토자가 확인해야 합니다.</p>' +
      footerNote();
    window.scrollTo({ top: 0 });
  }

  function roadmapHtml() {
    function col(cls, chip, title, items) {
      return '<div class="roadmap-col"><span class="stage-chip ' + cls + '">' + chip + '</span><h3>' + title + '</h3>' +

      '<p class="section-sub">현재 PoC에 구현된 기능과 향후 확장 계획을 구분해 표시합니다.</p>' +
      '<div class="roadmap">' +
        col('stage-now', '현재 구현', 'AI Quality Gate + 사람 검토', [
          '4단계 분석: 모호 표현 · 누락 조건 · 수정 요구사항 · Acceptance Criteria',
          'P0/P1 우선순위, 미확정 기술값은 [값]으로 분리',
          'Engineering Review 상태 관리 (미확정 → 검토 중 → 확정 / 범위 제외)',
          '결정값 입력 시 수정 요구사항에 즉시 반영',
          'AI 제안 항목별 채택 · 제외 (입력 내용은 이 브라우저에만 저장)',
          'Traceability: 누락 조건 → Engineering Review → AC 연결, 미연결 항목 점검, 전체 요구사항 추적 매트릭스',
          'PoC 내 유사 검토 사례: 업무 분류가 같고 ER 질문이 대응되는 다른 사례의 ER 질문 · 확정값 참조 (AI 검증 후 2쌍 이상일 때만 표시)'
        ]) +
        col('stage-next', '다음 단계', '실제 이력 축적', [
          '프로젝트별 검토 이력 저장 (현재는 브라우저 저장)',
          '유사 요구사항 조회를 PoC 사례 → 조직의 과거 요구사항으로 확대'
        ]) +
        col('stage-future', '향후 확장', '조직 요구사항 자산화', [
          '검토 이력 저장 및 다음 프로젝트에서 재사용',
          '공식 문서 기반 검토 근거 연결',
          '요구사항 변경 시 영향 범위 분석'
        ]) +
      '</div>'
    );
  }

  // ---------- CASE DETAIL ----------
  function newsBlock(c) {
    var hasAny = c.news_outlet || c.news_date || c.news_url;
    var outlet = c.news_outlet ? esc(c.news_outlet) : '<span class="placeholder">(출처 정보 추가 예정)</span>';
    var date = c.news_date ? esc(c.news_date) : (c.date_label ? esc(c.date_label) : '<span class="placeholder">-</span>');
    var link = c.news_url
      ? '<a href="' + escAttr(c.news_url) + '" target="_blank" rel="noopener">원문 기사 보기 &rarr;</a>'
      : '<span class="val placeholder">(링크 추가 예정)</span>';
    return (
      '<div class="meta-item"><span class="label">출처</span><span class="val' + (c.news_outlet ? '' : ' placeholder') + '">' + outlet + '</span></div>' +
      '<div class="meta-item"><span class="label">일자</span><span class="val' + (c.news_date ? '' : ' placeholder') + '">' + date + '</span></div>' +
      '<div class="meta-item"><span class="label">원문 링크</span><span class="val">' + link + '</span></div>'
    );
  }

  // ---------- REVIEW CLOSURE (human-in-the-loop) ----------
  // AI output is a set of candidates: the viewer adopts/excludes items, resolves each Engineering
  // Review question, and enters decided values, which replace the matching [placeholder] in the
  // revised requirement. Stored per viewer in this browser only (a demo, not shared records).
  var REVIEW_KEY = 'rqg-review-v1';
  var review = {};
  try { review = JSON.parse(localStorage.getItem(REVIEW_KEY) || '{}') || {}; } catch (e) { review = {}; }
  function saveReview() { try { localStorage.setItem(REVIEW_KEY, JSON.stringify(review)); } catch (e) {} }

  var ER_STATUS = [
    { key: 'open', label: '미확정' },
    { key: 'review', label: '검토 중' },
    { key: 'closed', label: '확정' },
    { key: 'out', label: '범위 제외' }
  ];
  var REQ_INDEX = {};
  DATA.cases.forEach(function (c) {
    c.requirements.forEach(function (r) { REQ_INDEX[r.id] = { req: r, caseType: c.case_type, caseId: c.id, caseTitle: c.title }; });
  });

  var PH_RE = /\[[^\]]+\]/g;
  function placeholders(req) { return String(req.revised_requirement || '').match(PH_RE) || []; }
  function erStatus(rid, i) { return review[rid + '|er|' + i] || 'open'; }
  function phValue(rid, i) { return String(review[rid + '|ph|' + i] || '').trim(); }
  function decision(rid, kind, i) { return review[rid + '|' + kind + '|' + i] || ''; }

  // A [placeholder] tied to an Engineering Review question marked 범위 제외 is N/A: it no longer blocks
  // the requirement from being confirmed, and its bracket is shown as N/A in the After text.
  function phNA(req, i) {
    var link = (req.placeholder_links || [])[i];
    return typeof link === 'number' && link >= 0 && erStatus(req.id, link) === 'out';
  }

  function reviewStats(req) {
    var rid = req.id;
    var eng = req.engineering_review_required || [];
    var phs = placeholders(req);
    var s = { erTotal: eng.length, erDone: 0, phTotal: 0, phFilled: 0, phNA: 0, mi: { adopt: 0, exclude: 0 }, ac: { adopt: 0, exclude: 0 } };
    eng.forEach(function (_, i) { var st = erStatus(rid, i); if (st === 'closed' || st === 'out') s.erDone++; });
    phs.forEach(function (_, i) {
      if (phNA(req, i)) { s.phNA++; return; }
      s.phTotal++;
      if (phValue(rid, i)) s.phFilled++;
    });
    (req.missing_items || []).forEach(function (_, i) { var d = decision(rid, 'mi', i); if (d) s.mi[d]++; });
    (req.acceptance_criteria || []).forEach(function (_, i) { var d = decision(rid, 'ac', i); if (d) s.ac[d]++; });
    s.confirmed = s.erDone === s.erTotal && s.phFilled === s.phTotal;
    return s;
  }

  function renderRevised(req) {
    var rid = req.id, links = req.placeholder_links || [], i = -1;
    return esc(req.revised_requirement || '').replace(PH_RE, function (m) {
      i++;
      if (phNA(req, i)) return '<span class="ph ph-na" title="' + m.replace(/"/g, '&quot;') + ' — 범위 제외">N/A</span>';
      var v = phValue(rid, i);
      if (!v) return '<span class="ph ph-value">' + m + '</span>';
      var link = links[i];
      var closed = (typeof link === 'number' && link >= 0) ? erStatus(rid, link) === 'closed' : true;
      return '<span class="ph ' + (closed ? 'ph-filled' : 'ph-draft') + '" title="' + m.replace(/"/g, '&quot;') + '">' + esc(v) + '</span>';
    });
  }

  function afterInner(req) {
    var s = reviewStats(req);
    var state = s.confirmed
      ? '<span class="after-state done">ER 완료</span>'
      : '<span class="after-state open">미정 ' + (s.phTotal - s.phFilled) + '개</span>';
    var label = s.confirmed ? 'After (Engineering Review 반영안)' : 'After (수정된 요구사항)';
    return '<span class="ba-label">' + label + state + '</span>' + renderRevised(req);
  }

  function chipHtml(req) {
    var s = reviewStats(req);
    return '<span class="req-progress' + (s.confirmed ? ' done' : '') + '" data-chip="' + escAttr(req.id) + '">' +
      (s.confirmed ? 'ER 완료' : '검토 ' + s.erDone + '/' + s.erTotal) + '</span>';
  }

  function barInner(req) {
    var s = reviewStats(req);
    return (
      '<span>ER 확정 <b>' + s.erDone + '/' + s.erTotal + '</b></span>' +
      '<span>미정 값 입력 <b>' + s.phFilled + '/' + s.phTotal + '</b></span>' +
      '<span>누락 조건 채택 <b>' + s.mi.adopt + '</b> · 제외 <b>' + s.mi.exclude + '</b></span>' +
      '<button class="btn" data-action="review-reset" data-rid="' + escAttr(req.id) + '">검토 초기화</button>'
    );
  }

  function idChip(prefix, i) { return '<span class="tr-id">' + prefix + '-' + (i + 1) + '</span>'; }

  // Coverage over the AI-proposed links (indices follow rank order = display order).
  function traceCoverage(req) {
    var t = req.traceability || { mi_to_er: [], ac_to_mi: [], ac_to_er: [] };
    var nMi = (req.missing_items || []).length;
    var acByMi = [], i;
    for (i = 0; i < nMi; i++) acByMi.push([]);
    var acOrphans = [];
    // Items the reviewer excluded (제외) drop out of the coverage check on both sides.
    (t.ac_to_mi || []).forEach(function (mis, a) {
      if (decision(req.id, 'ac', a) === 'exclude') return;
      if (!mis.length) acOrphans.push(a);
      mis.forEach(function (m) { if (acByMi[m]) acByMi[m].push(a); });
    });
    var miNoAc = [];
    acByMi.forEach(function (list, m) {
      if (!list.length && decision(req.id, 'mi', m) !== 'exclude') miNoAc.push(m);
    });
    return { acByMi: acByMi, acOrphans: acOrphans, miNoAc: miNoAc };
  }

  function decideHtml(rid, kind, i) {
    var d = decision(rid, kind, i);
    function b(val, text) {
      return '<button type="button" class="d-' + val + '" aria-pressed="' + (d === val) + '" data-action="decide" data-rid="' + escAttr(rid) +
        '" data-kind="' + kind + '" data-idx="' + i + '" data-val="' + val + '">' + text + '</button>';
    }
    return '<span class="decide">' + b('adopt', '채택') + b('exclude', '제외') + '</span>';
  }

  function patchReview(rid) {
    var entry = REQ_INDEX[rid];
    if (!entry) return;
    var sel = '[data-rid="' + rid + '"]';
    var after = document.querySelector('.ba-after' + sel);
    if (after) after.innerHTML = afterInner(entry.req);
    var bar = document.querySelector('.review-bar' + sel);
    if (bar) bar.innerHTML = barInner(entry.req);
    var chip = document.querySelector('[data-chip="' + rid + '"]');
    if (chip) chip.outerHTML = chipHtml(entry.req);
  }

  function rerenderReview(rid) {
    var entry = REQ_INDEX[rid];
    var body = document.querySelector('.req-body[data-rid="' + rid + '"]');
    if (!entry || !body) return;
    var prev = body.querySelector('.more-details');
    var wasOpen = !!(prev && prev.open);
    body.innerHTML = reqBodyInner(entry.req, entry.caseType);
    if (wasOpen) { var next = body.querySelector('.more-details'); if (next) next.open = true; }
    patchReview(rid);
  }

  function requirementBlockHtml(req, idx, total, caseType) {
    return (
      '<details class="req-block"' + (idx === 0 ? ' open' : '') + '>' +
        '<summary>' +
          '<span><span class="req-num">REQ ' + (idx + 1) + ' / ' + total + ' &middot; ' + esc(req.id) + '</span>' + chipHtml(req) +
          '<p class="req-title">&ldquo;' + esc(req.requirement_text) + '&rdquo;</p></span>' +
          '<span class="req-caret">&#9656;</span>' +
        '</summary>' +
        '<div class="req-body" data-rid="' + escAttr(req.id) + '">' + reqBodyInner(req, caseType) + '</div>' +
      '</details>'
    );
  }

  function reqBodyInner(req, caseType) {
    var rid = req.id;
    var missing = sortByRank(req.missing_items);
    var eng = sortByRank(req.engineering_review_required);
    var ac = sortByRank(req.acceptance_criteria);
    var phs = placeholders(req);
    var links = req.placeholder_links || [];

    function missingHtml() {
      if (!missing.length) return '<p class="empty">해당 없음</p>';
      return '<ul class="review-list">' + missing.map(function (m, i) {
        var d = decision(rid, 'mi', i);
        return '<li class="' + (d === 'exclude' ? 'is-excluded' : '') + '"><span class="item-text">' + idChip('MI', i) + badge(m.priority) + ' [' + esc(m.category) + '] ' + esc(m.item) + '</span>' +
          decideHtml(rid, 'mi', i) + '</li>';
      }).join('') + '</ul>';
    }
    function phFieldHtml(i) {
      var na = phNA(req, i);
      return '<span class="ph ' + (na ? 'ph-na' : 'ph-value') + '">' + esc(phs[i]) + '</span>' +
        '<input class="ph-input" type="text" data-rid="' + escAttr(rid) + '" data-ph="' + i + '" value="' + escAttr(na ? '' : phValue(rid, i)) + '"' +
        (na ? ' disabled placeholder="범위 제외 — N/A"' : ' placeholder="결정값 입력"') + ' aria-label="' + escAttr(phs[i]) + ' 결정값">';
    }
    function engHtml() {
      if (!eng.length) return '<p class="empty">해당 없음</p>';
      var items = eng.map(function (e, i) {
        var st = erStatus(rid, i);
        var opts = ER_STATUS.map(function (o) {
          return '<option value="' + o.key + '"' + (o.key === st ? ' selected' : '') + '>' + o.label + '</option>';
        }).join('');
        var fields = [];
        links.forEach(function (l, p) { if (l === i) fields.push(phFieldHtml(p)); });
        return (
          '<div class="er-item st-' + st + '">' +
            '<div class="er-head"><span>' + idChip('ER', i) + badge(e.priority) + ' ' + esc(e.question) + '</span>' +
              '<select class="er-status st-' + st + '" data-rid="' + escAttr(rid) + '" data-er="' + i + '" aria-label="검토 상태">' + opts + '</select>' +
            '</div>' +
            (fields.length ? '<div class="ph-fields">' + fields.join('') + '</div>' : '') +
          '</div>'
        );
      }).join('');
      var extra = [];
      phs.forEach(function (_, p) { var l = links[p]; if (!(typeof l === 'number' && l >= 0)) extra.push(phFieldHtml(p)); });
      var extraHtml = extra.length
        ? '<p class="er-extra-title">ER 질문 외 추가 결정 항목</p><div class="ph-fields">' + extra.join('') + '</div>'
        : '';
      return '<p class="review-note">상태를 정하고 결정값을 입력하면 ③ After에 바로 반영됩니다. 입력 내용은 이 브라우저에만 저장됩니다.</p>' + items + extraHtml;
    }
    function ambiguousHtml() {
      if (!req.ambiguous_terms || !req.ambiguous_terms.length) return '<p class="empty">해당 없음</p>';
      return '<ul>' + req.ambiguous_terms.map(function (t) {
        return '<li><b>' + esc(t.term)+ '</b><span class="basis">' + esc(t.issue) + '</span></li>';
      }).join('') + '</ul>';
    }
    function acHtml(withButtons) {
      if (!ac.length) return '<p class="empty">해당 없음</p>';
      return '<ul class="ac-list">' + ac.map(function (c, i) {
        var d = decision(rid, 'ac', i);
        return '<li class="ac-item' + (d === 'exclude' ? ' is-excluded' : '') + '"><span class="item-text">' + idChip('AC', i) + badge(c.priority) + ' ' + esc(c.criterion) + '</span>' +
          (withButtons ? decideHtml(rid, 'ac', i) : '') + '</li>';
      }).join('') + '</ul>';
    }

    // Similar requirements from other cases in this PoC. Shows the other item's actual ER questions and,
    // if this viewer already confirmed them in this browser, the decided values (reuse of past decisions).
    function similarHtml() {
      var sims = (req.similar || []).filter(function (s) { return REQ_INDEX[s.other_id]; });
      var catChip = req.task_category ? '<span class="tag">업무 분류 · ' + esc(req.task_category) + '</span>' : '';
      if (!sims.length) {
        if (!req.task_category) return '';
        return (
          '<div class="stage">' +
            '<p class="stage-num">유사 검토 이력</p>' +
            '<p class="review-note">' + catChip + '</p>' +
            '<p class="empty">유사 검토 이력 없음 — 같은 업무 분류에서 답을 참고할 수 있는 ER 질문이 2개 이상 대응되는 사례가 이 PoC 데이터에 없습니다.</p>' +
          '</div>'
        );
      }
      var cards = sims.map(function (s) {
        var o = REQ_INDEX[s.other_id], oreq = o.req;
        var oeng = sortByRank(oreq.engineering_review_required);
        var oplinks = oreq.placeholder_links || [];
        var oph = placeholders(oreq);
        var pairs = s.er_pairs.map(function (pr) {
          var q = oeng[pr[1]], mine = eng[pr[0]];
          if (!q || !mine) return '';
          var st = erStatus(oreq.id, pr[1]);
          var label = ER_STATUS.filter(function (x) { return x.key === st; })[0].label;
          var vals = [];
          oplinks.forEach(function (l, p) { if (l === pr[1] && phValue(oreq.id, p)) vals.push(oph[p] + ' → ' + phValue(oreq.id, p)); });
          return '<li>' + idChip('ER', pr[0]) + '<span class="sim-arrow">↔</span>' + esc(o.caseTitle) + ' ' + idChip('ER', pr[1]) + esc(q.question) +
            '<span class="tr-state st-' + st + '">' + label + '</span>' +
            (vals.length ? '<span class="sim-vals">확정값: ' + esc(vals.join(', ')) + '</span>' : '') + '</li>';
        }).join('');
        return (
          '<div class="sim-card">' +
            '<div class="sim-head"><span class="sim-topic">공통 결정 항목 · ' + esc(s.topic) + '</span>' +
              '<button class="btn" data-action="open-case" data-case-id="' + escAttr(o.caseId) + '" data-req-id="' + escAttr(oreq.id) + '">' + esc(o.caseTitle) + ' · ' + esc(oreq.id) + ' 보기 &rarr;</button></div>' +
            '<p class="sim-req">&ldquo;' + esc(oreq.requirement_text) + '&rdquo;</p>' +
            (pairs ? '<ul class="sim-pairs">' + pairs + '</ul>' : '') +
          '</div>'
        );
      }).join('');
      return (
        '<div class="stage">' +
          '<p class="stage-num">유사 검토 이력 — 다른 사례에서 이미 검토한 요구사항</p>' +
          '<p class="review-note">' + catChip + ' 같은 업무 분류에서 공통 결정 항목이 2개 이상인 사례를 최대 2건 표시합니다. 별도 이력 DB가 아닌 PoC 분석 데이터 내 유사 사례입니다.</p>' +
          cards +
        '</div>'
      );
    }

    function traceHtml() {
      var t = req.traceability;
      if (!t || !missing.length) return '';
      var cov = traceCoverage(req);
      function erCell(idxs) {
        if (!idxs.length) return '<span class="tr-warn">— 연결된 ER 없음</span>';
        return idxs.map(function (ei) {
          var st = erStatus(rid, ei);
          var label = ER_STATUS.filter(function (o) { return o.key === st; })[0].label;
          return '<span class="cell-item" title="' + escAttr(eng[ei].question) + '">' + idChip('ER', ei) + esc(eng[ei].question) +
            '<span class="tr-state st-' + st + '">' + label + '</span></span>';
        }).join('');
      }
      function acCell(idxs) {
        if (!idxs.length) return '<span class="tr-warn">⚠ 검증하는 AC 없음</span>';
        return idxs.map(function (ai) {
          return '<span class="cell-item' + (decision(rid, 'ac', ai) === 'exclude' ? ' is-excluded' : '') + '">' + idChip('AC', ai) + esc(ac[ai].criterion) + '</span>';
        }).join('');
      }
      var rows = missing.map(function (m, i) {
        var excluded = decision(rid, 'mi', i) === 'exclude';
        return '<tr>' +
          '<td><span class="cell-item' + (excluded ? ' is-excluded' : '') + '">' + idChip('MI', i) + badge(m.priority) + ' ' + esc(m.item) + '</span></td>' +
          '<td>' + erCell(t.mi_to_er[i] || []) + '</td>' +
          '<td>' + (excluded ? '<span class="tr-state">제외한 조건 — 점검 대상 아님</span>' : acCell(cov.acByMi[i])) + '</td>' +
        '</tr>';
      }).join('');
      var warns = [];
      cov.acOrphans.forEach(function (ai) { warns.push('AC-' + (ai + 1) + '은 연결된 누락 조건이 없습니다 — 근거 확인이 필요합니다.'); });
      cov.miNoAc.forEach(function (mi) { warns.push('MI-' + (mi + 1) + '을 검증하는 AC가 없습니다.'); });
      var foot = warns.length
        ? '<div class="trace-warns">추적 확인 필요 ' + warns.length + '건<ul>' + warns.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>'
        : '<p class="trace-ok">모든 누락 조건이 AC로 검증되고, 모든 AC가 누락 조건에 연결되어 있습니다.</p>';
      return (
        '<div class="stage">' +
          '<p class="stage-num">Traceability — 누락 조건 → Engineering Review → AC</p>' +
          '<div class="table-wrap"><table class="trace"><thead><tr><th>누락 조건</th><th>Engineering Review</th><th>Acceptance Criteria</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          foot +
          '<p class="stage-note">※ 연결은 AI가 기존 결과 항목 간 관련성을 판단해 제안한 것이며, 검토자가 확인해야 합니다.</p>' +
        '</div>'
      );
    }

    var stageOneLabel = caseType === 'value' ? '① 도입 사례 기반 가상 요구사항'
      : caseType === 'risk' ? '① 사고 기반 가상 요구사항'
      : '① 입력한 요구사항';
    var stageOneNote = caseType === 'value' ? '※ 실제 도입 사례 사실을 기반으로 작성한 가상 요구사항입니다.'
      : caseType === 'risk' ? '※ 실제 사고 사실을 기반으로 작성한 가상 요구사항입니다.'
      : '※ 직접 입력하신 요구사항 문장입니다.';

    return (
          '<div class="review-bar" data-rid="' + escAttr(rid) + '">' + barInner(req) + '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">' + stageOneLabel + '</p>' +
            '<div class="virtual-req">&ldquo;' + esc(req.requirement_text) + '&rdquo;</div>' +
            '<p class="stage-note">' + stageOneNote + '</p>' +
          '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">② AI Quality Gate 결과 — 누락 조건 · Engineering Review</p>' +
            '<div class="subcard"><h4>누락 조건</h4>' + missingHtml() + '</div>' +
            '<div class="subcard subcard-full"><h4>Engineering Review — 엔지니어 검토·확정</h4>' + engHtml() + '</div>' +
          '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">③ Before &rarr; After</p>' +
            '<div class="before-after">' +
              '<div class="ba-block ba-before"><span class="ba-label">Before (원본)</span>' + esc(req.requirement_text) + '</div>' +
              '<div class="ba-arrow">&darr;</div>' +
              '<div class="ba-block ba-after" data-rid="' + escAttr(rid) + '">' + afterInner(req) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="stage">' +
            '<p class="stage-num">④ Acceptance Criteria (초안)</p>' +
            acHtml(false) +
          '</div>' +
          '<details class="more-details">' +
            '<summary>상세 검토 정보 보기 <span class="more-hint">모호한 표현 · AC 개별 검토 · Traceability · 유사 검토 이력</span></summary>' +
            '<div class="more-body">' +
              '<div class="stage"><p class="stage-num">모호한 표현</p><div class="subcard">' + ambiguousHtml() + '</div></div>' +
              '<div class="stage"><p class="stage-num">AC 개별 검토 — 채택 · 제외</p>' + acHtml(true) + '</div>' +
              traceHtml() +
              similarHtml() +
            '</div>' +
          '</details>'
    );
  }

  function renderDetail(caseId) {
    var c = DATA.cases.filter(function (x) { return x.id === caseId; })[0];
    if (!c) { renderHome(); return; }
    var reqsHtml = c.requirements.map(function (r, i) { return requirementBlockHtml(r, i, c.requirements.length, c.case_type); }).join('');
    var tags = c.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var sectionTitle = c.case_type === 'value' ? '도입 사례에서 도출한 가상 요구사항' : '사고에서 도출한 가상 요구사항';
    var sectionSub = c.case_type === 'value'
      ? '각 항목을 펼치면 도입 사례 기반 요구사항 → 품질 분석 → 수정안 → Acceptance Criteria까지 전체 흐름을 볼 수 있습니다.'
      : '각 항목을 펼치면 사고 기반 요구사항 → 품질 분석 → 수정안 → Acceptance Criteria까지 전체 흐름을 볼 수 있습니다.';

    app.innerHTML =
      '<div class="topnav">' +
        '<div class="brand" data-action="go-home"><span class="brand-mark">Requirements Quality Gate</span></div>' +
        '<div class="nav-actions"></div>' +
      '</div>' +
      '<button class="btn btn-back" data-action="go-home">&larr; 전체 사례로</button>' +
      '<div class="case-header">' +
        '<span class="case-type-badge case-type-' + c.case_type + '">' + CASE_TYPE_LABEL[c.case_type] + '</span>' +
        '<h2>' + esc(c.title) + '</h2>' +
        '<div class="meta-grid">' + newsBlock(c) + '</div>' +
        '<div class="summary-box">' + esc(c.summary) + '</div>' +
        '<div class="tag-row" style="margin-top:12px">' + tags + '</div>' +
      '</div>' +
      '<p class="section-title">' + sectionTitle + ' (' + c.requirements.length + '개)</p>' +
      '<p class="section-sub">' + sectionSub + '</p>' +
      priorityLegendHtml() +
      reqsHtml +
      footerNote();

    window.scrollTo({ top: 0 });
  }

  function footerNote() {
    return (
      '<footer class="page-note">요구사항 품질 분석은 LLM 기반 4단계 파이프라인(모호성 탐지 → 누락 조건 탐지 → 수정안 생성 → Acceptance Criteria 생성)으로 생성했습니다. 업무 분류와 항목 간 연결은 LLM이 1차 제안하고 검토·보정했으며, 모든 결과는 사람이 검토·확정하도록 설계했습니다. 확정되지 않은 기술 수치는 <code class="mono">[값]</code>으로 남기고 임의로 지어내지 않습니다. 검토 상태·결정값·채택 여부는 서버에 저장되지 않고 이 브라우저에만 남습니다.</footer>'
    );
  }

  // ---------- router ----------
  function render() {
    if (state.view === 'home') renderHome();
    else if (state.view === 'detail') renderDetail(state.caseId);
    else if (state.view === 'matrix') renderMatrix();
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (action === 'go-home') { state = { view: 'home', caseId: null }; render(); window.scrollTo({ top: 0 }); }
    else if (action === 'go-matrix') { state = { view: 'matrix', caseId: null }; render(); }
    else if (action === 'open-case') {
      state = { view: 'detail', caseId: el.getAttribute('data-case-id') }; render();
      var focusId = el.getAttribute('data-req-id');
      var target = focusId && document.querySelector('.req-body[data-rid="' + focusId + '"]');
      if (target) {
        target.parentNode.open = true;
        target.parentNode.scrollIntoView();
      }
    }
    else if (action === 'decide') {
      var key = el.getAttribute('data-rid') + '|' + el.getAttribute('data-kind') + '|' + el.getAttribute('data-idx');
      var val = el.getAttribute('data-val');
      if (review[key] === val) delete review[key]; else review[key] = val;
      saveReview(); rerenderReview(el.getAttribute('data-rid'));
    }
    else if (action === 'review-reset') {
      var rid = el.getAttribute('data-rid');
      Object.keys(review).forEach(function (k) { if (k.indexOf(rid + '|') === 0) delete review[k]; });
      saveReview(); rerenderReview(rid);
    }
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (!el.classList || !el.classList.contains('er-status')) return;
    var rid = el.getAttribute('data-rid');
    review[rid + '|er|' + el.getAttribute('data-er')] = el.value;
    saveReview(); rerenderReview(rid);
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!el.classList || !el.classList.contains('ph-input')) return;
    var rid = el.getAttribute('data-rid');
    var key = rid + '|ph|' + el.getAttribute('data-ph');
    if (el.value.trim()) review[key] = el.value; else delete review[key];
    saveReview(); patchReview(rid);
  });

  render();
})();
</script>
